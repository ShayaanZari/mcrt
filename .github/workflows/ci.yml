name: C++ CI

on:
  push:
    branches: [ main, josh ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build --config Release

    - name: Run Regression Test
      working-directory: build
      run: ctest --output-on-failure
